name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'production' to confirm deployment"
        required: true
        type: string
      invalidate_cache:
        description: "Invalidate CloudFront cache after deploy"
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.5.7"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production deployment
        if: inputs.confirm != 'production'
        run: |
          echo "::error::You must type 'production' to confirm deployment"
          exit 1

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npx vitest run

      - name: Admin lint
        working-directory: admin
        run: |
          npm ci
          npm run lint

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Backend build
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      # Terraform
      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config="profile="

      - name: Terraform apply production
        working-directory: infra
        run: |
          terraform workspace select default
          terraform apply -var="aws_account=" -auto-approve
        env:
          TF_VAR_www_google_site_verification_token: ${{ secrets.TF_VAR_GOOGLE_SITE_VERIFICATION }}
          TF_VAR_team_emails: ${{ secrets.TF_VAR_TEAM_EMAILS }}

      # Admin deploy
      - name: Build and deploy admin
        working-directory: admin
        run: |
          npm ci
          npm run build:production
          aws s3 sync dist/ s3://admin.tropicoretreat.com --delete

      - name: Invalidate admin CloudFront cache
        if: inputs.invalidate_cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.ADMIN_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      # Frontend deploy (continue-on-error: webpack/ajv compat issue pending fix)
      - name: Build and deploy frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          aws s3 sync dist/ s3://tropicoretreat.com --delete

      - name: Invalidate frontend CloudFront cache
        if: inputs.invalidate_cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
